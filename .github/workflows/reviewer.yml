name: DeepSeek Merge Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Step 1: 获取 PR 的 diff（兼容 fork 场景）
      # ------------------------------------------------------------
      - name: Generate PR diff
        id: diff
        run: |
          set -e
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # 确保 base commit 存在
          git fetch --no-tags --prune origin "$BASE_SHA" || true

          # 尝试通过 GitHub 的 refs/pull/N/head 获取 head
          if git fetch --no-tags --prune origin "pull/${PR_NUMBER}/head:pr_head"; then
            DIFF_RANGE="$BASE_SHA..pr_head"
          else
            # 备选：直接拉取 head SHA（可能来自 fork）
            git fetch --no-tags --prune origin "$HEAD_SHA" || true
            if git rev-parse --verify --quiet "$HEAD_SHA" >/dev/null; then
              DIFF_RANGE="$BASE_SHA..$HEAD_SHA"
            else
              echo "Error: Cannot fetch PR head commit" >&2
              exit 1
            fi
          fi

          git diff "$DIFF_RANGE" > pr.diff
          # 限制 diff 行数，避免超出 API 限制
          head -n 5000 pr.diff > pr_trimmed.diff

          # 输出 diff 内容供后续步骤使用
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat pr_trimmed.diff >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------
      # Step 2: 调用 DeepSeek API 进行审查
      # ------------------------------------------------------------
      - name: Request DeepSeek v4-flash review
        id: ai
        env:
          API_KEY: ${{ secrets.llm_api_key }}
        run: |
          set -e

          TITLE="${{ github.event.pull_request.title }}"
          BODY="${{ github.event.pull_request.body }}"
          DIFF_FILE="pr_trimmed.diff"

          # 构建 JSON 请求体，避免 shell 转义问题
          jq -n \
            --arg model "deepseek-v4-flash" \
            --arg system "你是一个代码审查专家。根据 PR 的 diff 判断是否允许合并，重点检查：逻辑错误、安全漏洞、破坏性变更。只返回 JSON：{\"allowed\": true/false, \"reason\": \"原因\"}" \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            --rawfile diff "$DIFF_FILE" \
            '{
              model: $model,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: ("PR 标题：" + $title + "\nPR 描述：" + $body + "\n\nDiff:\n" + $diff)}
              ],
              temperature: 0.1,
              max_tokens: 256
            }' > request.json

          echo "请求体大小: $(wc -c < request.json) 字节"

          # 发送请求并记录 HTTP 状态码
          curl -s --max-time 60 -o response_body -w "%{http_code}" \
            https://api.deepseek.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $API_KEY" \
            -d @request.json \
            > http_code.txt

          HTTP_CODE=$(cat http_code.txt)
          echo "HTTP状态码: $HTTP_CODE"

          # 处理非 200 响应
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "API 调用失败，状态码: $HTTP_CODE" >&2
            cat response_body >&2
            echo "allowed=false" >> $GITHUB_OUTPUT
            echo "reason=DeepSeek API 调用失败 (HTTP $HTTP_CODE)" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 验证响应是否为有效 JSON
          if ! jq -e . response_body >/dev/null 2>&1; then
            echo "响应不是有效的 JSON，前 200 字符:" >&2
            head -c 200 response_body >&2
            echo "allowed=false" >> $GITHUB_OUTPUT
            echo "reason=DeepSeek 返回格式错误" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 提取 content 字段
          CONTENT=$(jq -r '.choices[0].message.content // ""' response_body)
          if [ -z "$CONTENT" ]; then
            echo "AI 返回内容为空" >&2
            echo "allowed=false" >> $GITHUB_OUTPUT
            echo "reason=DeepSeek 返回内容为空" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 安全解析 AI 返回的 JSON（若解析失败则默认阻止）
          ALLOWED=$(echo "$CONTENT" | jq -r '.allowed // false' 2>/dev/null || echo "false")
          REASON=$(echo "$CONTENT" | jq -r '.reason // "未知原因"' 2>/dev/null || echo "AI 响应格式错误，拒绝合并")

          echo "allowed=$ALLOWED" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT
          echo "AI 结论: allowed=$ALLOWED, reason=$REASON"

      # ------------------------------------------------------------
      # Step 3: 设置初始合并检查状态（Commit Status）
      # ------------------------------------------------------------
      - name: Set initial merge check status
        id: set_status
        uses: actions/github-script@v7
        with:
          script: |
            const allowed = '${{ steps.ai.outputs.allowed }}';
            const reason = '${{ steps.ai.outputs.reason }}' || 'Blocked by DeepSeek';
            const state = allowed === 'true' ? 'success' : 'failure';
            const desc = reason ? reason.substring(0, 140) : (state === 'success' ? 'Approved by DeepSeek' : 'Blocked by DeepSeek');

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state,
              description: desc,
              context: 'deepseek-merge-check'
            });

            core.setOutput('allowed', allowed);

      # ------------------------------------------------------------
      # Step 4: 若未通过审查，终止工作流
      # ------------------------------------------------------------
      - name: Fail workflow if not allowed
        if: steps.set_status.outputs.allowed == 'false'
        run: |
          echo "❌ DeepSeek 审查未通过，合并被阻止。"
          exit 1

      # ------------------------------------------------------------
      # Step 5: 若通过审查，尝试自动合并
      # ------------------------------------------------------------
      - name: Merge pull request if allowed
        if: steps.set_status.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 1. 检查 PR 是否可合并（无冲突）
            const pr = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (pr.data.mergeable === false) {
              // 有冲突 → 更新状态为 failure 并退出
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: context.payload.pull_request.head.sha,
                state: 'failure',
                description: 'PR has merge conflicts, cannot auto-merge.',
                context: 'deepseek-merge-check'
              });
              core.setFailed('❌ PR has conflicts, auto-merge impossible.');
              return;
            }

            // 2. 执行合并
            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: prNumber,
                merge_method: 'merge',
                commit_title: `Auto-merge: ${pr.data.title}`,
                commit_message: `Merged automatically by DeepSeek AI review.`,
              });
              console.log(`✅ PR #${prNumber} merged successfully.`);
            } catch (error) {
              // 合并失败（如权限、意外冲突等）→ 更新状态为 failure
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: context.payload.pull_request.head.sha,
                state: 'failure',
                description: 'Auto-merge failed: ' + error.message.slice(0, 140),
                context: 'deepseek-merge-check'
              });
              core.setFailed(`❌ Auto-merge failed: ${error.message}`);
            }
